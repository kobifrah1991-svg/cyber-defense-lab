name: LangQuest Android

on:
  push:
    paths:
      - 'langquest/**'
      - '.github/workflows/langquest-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: langquest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: langquest/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # the default package list asks for the removed 'tools' package — name what the build needs
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Install
        run: npm ci

      - name: License server tests
        run: npm run test:server

      - name: Copy web app into the Android project
        run: npm run sync

      - name: Build debug APK
        working-directory: langquest/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Signed release APK + Play Store bundle — only when the signing secrets are configured:
      # ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Build signed release APK + AAB
        if: env.KEYSTORE_BASE64 != ''
        working-directory: langquest/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v5
        with:
          name: langquest-android
          path: |
            langquest/android/app/build/outputs/apk/**/*.apk
            langquest/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
