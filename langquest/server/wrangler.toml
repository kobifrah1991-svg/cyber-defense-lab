# Deploy:  npx wrangler deploy
# Secrets: npx wrangler secret put STRIPE_SECRET_KEY / LICENSE_SECRET
name = "tedralingo-license"
main = "license-worker.js"
compatibility_date = "2026-01-01"

[vars]
# Stripe price id → plan (create the three prices in Stripe, then paste their ids here)
PRICE_PLANS = '{"price_monthly_xxx":"monthly","price_yearly_xxx":"yearly","price_lifetime_xxx":"lifetime"}'
ALLOWED_ORIGINS = "https://localhost,http://localhost:8080"
TUTOR_DAILY_LIMIT = "60"

# AI tutor: npx wrangler secret put ANTHROPIC_API_KEY
# Optional daily cap per license — create a KV namespace and bind it:
# [[kv_namespaces]]
# binding = "TUTOR_KV"
# id = "<kv namespace id>"
