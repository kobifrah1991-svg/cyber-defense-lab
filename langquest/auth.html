<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TedraLingo — Speak up!</title>
  <link rel="icon" href="icons/icon-192.png">
  <style>
    :root { --sea: #0e7490; --sun: #f97316; --bg: #fdf8f1; --text: #1f2937; --muted: #6b7280; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --text: #e8eef8; --muted: #94a3b8; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, "Segoe UI", Heebo, Arial, sans-serif; padding: 16px; text-align: center; }
    main { max-width: 420px; width: 100%; }
    img { border-radius: 22px; }
    h1 { margin: 12px 0 4px; font-size: 1.6rem; }
    h1 b { color: var(--sun); }
    .tag { color: var(--sun); font-weight: 800; margin: 0 0 16px; }
    p { color: var(--muted); }
    button, a.btn { display: inline-flex; align-items: center; gap: 10px; justify-content: center; width: 100%; padding: 14px 18px; margin-top: 10px;
      border-radius: 14px; border: 2px solid #dadce0; background: #fff; color: #1f1f1f; font: 700 1.05rem/1 inherit; cursor: pointer; text-decoration: none; }
    a.btn.primary { background: var(--sea); border-color: var(--sea); color: #fff; }
    .g { font-weight: 900; color: #4285f4; font-size: 1.2rem; }
    .msg { min-height: 1.5em; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="" width="84" height="84">
    <h1 dir="ltr">Tedra<b>Lingo</b></h1>
    <p class="tag" dir="ltr">Speak up!</p>
    <p data-t="sub"></p>
    <button id="go" type="button"><span class="g">G</span> <span data-t="signIn"></span></button>
    <p class="msg" aria-live="polite"></p>
    <a class="btn primary" id="back" hidden></a>
  </main>
  <script src="js/cloud-config.js"></script>
  <script type="module">
    import { initializeApp } from './js/vendor/firebase/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup } from './js/vendor/firebase/firebase-auth.js';

    const STR = {
      he: { dir: 'rtl', sub: 'התחברו עם Google כדי לשמור את ההתקדמות שלכם בענן.', signIn: 'התחברות עם Google', wait: 'מתחברים…', done: 'מחוברים! חוזרים לאפליקציה…', back: 'חזרה לאפליקציה', toApp: 'ללומדה', error: 'ההתחברות לא הצליחה. נסו שוב.' },
      en: { dir: 'ltr', sub: 'Sign in with Google to save your progress in the cloud.', signIn: 'Sign in with Google', wait: 'Signing in…', done: 'Signed in! Returning to the app…', back: 'Back to the app', toApp: 'Open TedraLingo', error: 'Sign-in failed. Please try again.' },
      ar: { dir: 'rtl', sub: 'سجّلوا الدخول بحساب Google لحفظ تقدمكم في السحابة.', signIn: 'تسجيل الدخول عبر Google', wait: 'جارٍ تسجيل الدخول…', done: 'تم تسجيل الدخول! نعود إلى التطبيق…', back: 'العودة إلى التطبيق', toApp: 'افتحوا TedraLingo', error: 'فشل تسجيل الدخول. حاولوا مرة أخرى.' },
      ru: { dir: 'ltr', sub: 'Войдите через Google, чтобы сохранить прогресс в облаке.', signIn: 'Войти через Google', wait: 'Входим…', done: 'Готово! Возвращаемся в приложение…', back: 'Вернуться в приложение', toApp: 'Открыть TedraLingo', error: 'Не удалось войти. Попробуйте ещё раз.' }
    };
    const q = new URLSearchParams(location.search);
    const lang = STR[q.get('lang')] ? q.get('lang') : 'he';
    const S = STR[lang];
    const fromApp = q.get('app') === '1';
    const C = window.LQ_CLOUD;
    document.documentElement.lang = lang;
    document.documentElement.dir = S.dir;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = S[e.dataset.t]; });
    const msg = document.querySelector('.msg');
    const back = document.getElementById('back');

    const auth = getAuth(initializeApp(window.LQ_FIREBASE_CONFIG));
    auth.languageCode = lang;

    function handOff(idt) {
      // the Android app receives the Google ID token through its deep link and signs in to Firebase with it
      const url = `${C.scheme}://auth#idt=${encodeURIComponent(idt)}`;
      back.href = url;
      back.textContent = S.back;
      back.hidden = false;
      location.href = url;
    }

    document.getElementById('go').onclick = async () => {
      msg.className = 'msg'; msg.textContent = S.wait;
      try {
        const p = new GoogleAuthProvider();
        if (q.get('select') === '1') p.setCustomParameters({ prompt: 'select_account' });
        const res = await signInWithPopup(auth, p);
        msg.textContent = S.done;
        if (fromApp) {
          const cred = GoogleAuthProvider.credentialFromResult(res);
          if (!cred || !cred.idToken) throw new Error('no id token');
          handOff(cred.idToken);
        } else {
          back.href = 'index.html'; back.textContent = S.toApp; back.hidden = false;
          location.href = 'index.html';
        }
      } catch (e) {
        const c = (e && e.code) || '';
        msg.className = 'msg err';
        msg.textContent = /popup-closed|cancelled/.test(c) ? '' : S.error;
      }
    };
  </script>
</body>
</html>
