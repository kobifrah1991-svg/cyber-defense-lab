<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LangQuest — לומדה אינטראקטיבית לשפה מדוברת: שמיעה, הגייה, קריוקי, פירוק הברות ובדיקת דיבור חיה">
  <title>LangQuest · שפה מדוברת</title>
  <link rel="stylesheet" href="css/langquest.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
</head>
<body>
  <header class="top">
    <a href="#" class="logo" id="logoBtn" title="חזרה למפה">
      <span class="logo-ico">🗺️</span>
      <span class="logo-txt">Lang<b>Quest</b></span>
    </a>
    <nav class="hdr">
      <button class="hdr-btn" id="hdrLang" title="החלפת שפה"></button>
      <button class="hdr-btn" id="hdrStreak" type="button"></button>
      <span class="hdr-btn static" id="hdrXp" title="נקודות ניסיון"></span>
      <button class="hdr-btn" id="hdrVault" title="אוסף הביטויים"></button>
      <button class="hdr-btn" id="hdrSettings" title="הגדרות קול והגייה">⚙️</button>
    </nav>
  </header>

  <main id="view" class="wrap"></main>

  <dialog id="modal" class="modal">
    <div class="modal-body"></div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
