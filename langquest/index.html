<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e7490" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TedraLingo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="description" content="TedraLingo — לומדה אינטראקטיבית לשפה מדוברת: שמיעה, הגייה, קריוקי, פירוק הברות ובדיקת דיבור חיה">
  <title>TedraLingo — Speak up!</title>
  <link rel="stylesheet" href="css/tedralingo.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
</head>
<body>
  <header class="top">
    <a href="#" class="logo" id="logoBtn" data-i18n-title="hdr.home">
      <span class="logo-ico">🗺️</span>
      <span class="logo-txt">Tedra<b>Lingo</b></span>
    </a>
    <nav class="hdr">
      <button class="hdr-btn hidden" id="hdrInstall" data-i18n-title="pwa.install">📲</button>
      <button class="hdr-btn" id="hdrLang" data-i18n-title="hdr.lang"></button>
      <button class="hdr-btn" id="hdrStreak" type="button"></button>
      <button class="hdr-btn" id="hdrXp" data-i18n-title="aw.title"></button>
      <button class="hdr-btn" id="hdrVault" data-i18n-title="hdr.vault"></button>
      <button class="hdr-btn" id="hdrSettings" data-i18n-title="hdr.settings">⚙️</button>
    </nav>
  </header>

  <main id="view" class="wrap"></main>

  <dialog id="modal" class="modal">
    <div class="modal-body"></div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/grammar.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/native.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/commerce.js"></script>
  <script src="js/engage.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/course.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/tutor.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud-config.js"></script>
  <script src="js/cloud-merge.js"></script>
  <script type="module" src="js/cloud.js"></script>
</body>
</html>
